# Hardened CI workflow for totaldrop-core: multi-OS/arch test matrix,
# cross-architecture target verification (armv7, riscv64gc, wasm32+simd128),
# 90% line coverage gate, cargo-deny, REUSE 3.3, and secret scanning.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        env:
          TOTALDROP_REQUIRE_IPV6: "1"
        run: cargo test --workspace --locked
      - name: Test upstream delta, 35-language codegen & cloud sync tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m py_compile tools/sync_upstream_delta.py tools/test_sync_upstream_delta.py tools/sync_gdrive_cloud.py tools/l10n_codegen.py tools/test_l10n_codegen.py
          python3 tools/test_sync_upstream_delta.py -v
          python3 tools/l10n_codegen.py --check
          python3 tools/test_l10n_codegen.py -v

  cross-targets:
    name: Cross-architecture targets (armv7, riscv64gc, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and cross targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add armv7-unknown-linux-gnueabihf riscv64gc-unknown-linux-gnu wasm32-unknown-unknown
      - name: Check armv7-unknown-linux-gnueabihf (+vfp3,+neon)
        env:
          RUSTFLAGS: -D warnings -C target-feature=+vfp3,+neon
        run: >-
          cargo clippy --target armv7-unknown-linux-gnueabihf
          -p totaldrop-crypto -p totaldrop-proto -p totaldrop-l10n
          --locked -- -D warnings
      - name: Check riscv64gc-unknown-linux-gnu (generic-rv64)
        env:
          RUSTFLAGS: -D warnings -C target-cpu=generic-rv64
        run: >-
          cargo clippy --target riscv64gc-unknown-linux-gnu
          -p totaldrop-crypto -p totaldrop-proto -p totaldrop-l10n
          --locked -- -D warnings
      - name: Check wasm32-unknown-unknown (+simd128)
        env:
          RUSTFLAGS: -D warnings -C target-feature=+simd128 --cfg getrandom_backend="custom"
        run: >-
          cargo clippy --target wasm32-unknown-unknown
          -p totaldrop-crypto -p totaldrop-proto -p totaldrop-l10n
          --locked -- -D warnings
      - name: Build wasm32-simd128 profile via targets/build-arch.sh
        run: ./targets/build-arch.sh wasm32-simd128 --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure
        env:
          TOTALDROP_REQUIRE_IPV6: "1"
        run: >-
          cargo llvm-cov --workspace --locked --summary-only --fail-under-lines 90

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: ./tools/check-spdx.sh
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..HEAD
          else
            base=HEAD range=HEAD
          fi
          echo "Scanning $range"
          { echo "BASE=$base"; echo "RANGE=$range"; } >>"$GITHUB_ENV"
      - name: No signing keys, key.properties or .gitleaksignore
        run: |
          found=$(
            { git ls-files -z
              git -c core.quotePath=false log --format= --name-only -z --no-renames --diff-filter=d "$RANGE"
            } | grep -ziE '(^|/)(key\.properties|\.gitleaksignore)$|\.(jks|keystore|p12|pfx|pepk)$' | tr '\0' '\n' | sort -u
          )
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Signing keys, key.properties and .gitleaksignore must not be committed."
            exit 1
          fi
      - name: gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          cfg=$RUNNER_TEMP/gitleaks
          mkdir -p "$cfg"
          if ! git show "$BASE:.gitleaks.toml" >"$cfg/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' >"$cfg/gitleaks.toml"
          fi
          docker run --rm --volume "$PWD/.git:/repo/.git:ro" --volume "$cfg:/cfg:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --config /cfg/gitleaks.toml \
            --gitleaks-ignore-path /cfg --ignore-gitleaks-allow \
            --log-opts="--text $RANGE" /repo

  gate:
    name: CI
    if: always()
    needs: [test, cross-targets, coverage, deny, reuse, secrets]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
